<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ALPHABEAR QUANT TERMINAL</title>
    <script src="https://cdn.plot.ly/plotly-2.27.0.min.js"></script>
    <style>
        body { background-color: #080b11; color: #00f2fe; font-family: sans-serif; margin: 0; padding: 20px; }
        .header { display: flex; justify-content: space-between; border-bottom: 1px solid #1f293d; padding-bottom: 10px; }
        .price-card { font-size: 32px; font-weight: bold; color: #fff; }
        .stats-grid { display: grid; grid-template-columns: 1fr 3fr; gap: 20px; margin-top: 20px; }
        .panel { background: #0f172a; border: 1px solid #1e293b; border-radius: 8px; padding: 20px; }
        .stat-row { display: flex; justify-content: space-between; margin-bottom: 12px; font-size: 14px; }
        .btn-run { background: #00f2fe; color: #000; border: none; padding: 12px 24px; font-weight: bold; border-radius: 4px; cursor: pointer; width: 100%; margin-top: 15px; }
    </style>
</head>
<body>

    <div class="header">
        <h2>ALPHABEAR QUANT TERMINAL</h2>
        <div>STATUS: <span style="color: #00ff88;">AI ENGINE ACTIVE</span></div>
    </div>

    <div class="stats-grid">
        <div class="panel">
            <div style="color: #94a3b8; font-size: 12px;">BTC / USDT</div>
            <div class="price-card" id="current-price">$68,734.21</div>
            <hr style="border-color: #1e293b; margin: 15px 0;">
            <div class="stat-row"><span>Mean Expected:</span><strong id="p-mean" style="color:#fff;">-</strong></div>
            <div class="stat-row"><span>95% Percentile (Bull):</span><strong id="p-95" style="color:#00ff88;">-</strong></div>
            <div class="stat-row"><span>75% Percentile:</span><strong id="p-75" style="color:#00f2fe;">-</strong></div>
            <div class="stat-row"><span>50% Median:</span><strong id="p-50" style="color:#ffcc00;">-</strong></div>
            <div class="stat-row"><span>5% Percentile (Bear):</span><strong id="p-5" style="color:#ff0055;">-</strong></div>
            <button class="btn-run" onclick="fetchSimulation()">RUN MONTE CARLO (10,000 PATHS)</button>
        </div>

        <div class="panel">
            <div id="chart-container" style="width:100%; height:600px;"></div>
        </div>
    </div>

    <script>
        const API_URL = "https://quant-monte-carlo-engine.onrender.com/simulate";

        async function fetchSimulation() {
            try {
                const response = await fetch(API_URL);
                const data = await response.json();

                document.getElementById('current-price').innerText = `$${data.current_price.toLocaleString()}`;
                document.getElementById('p-mean').innerText = `$${Math.round(data.mean_expected_price).toLocaleString()}`;
                document.getElementById('p-95').innerText = `$${Math.round(data.percentile_95).toLocaleString()}`;
                document.getElementById('p-75').innerText = `$${Math.round(data.percentile_75).toLocaleString()}`;
                document.getElementById('p-50').innerText = `$${Math.round(data.percentile_50).toLocaleString()}`;
                document.getElementById('p-5').innerText = `$${Math.round(data.percentile_5).toLocaleString()}`;

                renderProbabilisticCloud(data);
            } catch (err) {
                console.error(err);
            }
        }

        function renderProbabilisticCloud(data) {
            let xData = [], yData = [], zData = [], colorData = [];
            const steps = 50; 
            const samplesPerStep = 60; 

            for (let step = 0; step <= steps; step++) {
                let day = (step / steps) * 252;
                let progress = step / steps;
                
                let currentMean = data.current_price + (data.mean_expected_price - data.current_price) * progress;
                let currentSpread = ((data.percentile_95 - data.percentile_5) / 2) * Math.sqrt(progress);

                for (let i = 0; i < samplesPerStep; i++) {
                    let u1 = Math.random(), u2 = Math.random();
                    let randStd = Math.sqrt(-2.0 * Math.log(u1)) * Math.cos(2.0 * Math.PI * u2);
                    
                    let price = currentMean + randStd * (currentSpread / 2);
                    let probabilityDepth = Math.exp(-0.5 * randStd * randStd) * 100;

                    xData.push(day);
                    yData.push(price);
                    zData.push(probabilityDepth);
                    colorData.push(price);
                }
            }

            const cloudTrace = {
                x: xData,
                y: yData,
                z: zData,
                mode: 'markers',
                type: 'scatter3d',
                marker: {
                    size: 2.5,
                    color: colorData,
                    colorscale: [
                        [0, '#ff0055'],
                        [0.25, '#ffcc00'],
                        [0.5, '#00f2fe'],
                        [0.75, '#00ff88'],
                        [1, '#e000ff']
                    ],
                    opacity: 0.6
                },
                name: 'Probability Cloud'
            };

            const layout = {
                title: { text: '3D Monte Carlo Probabilistic Density Cloud', font: { color: '#ffffff' } },
                paper_bgcolor: '#0f172a',
                plot_bgcolor: '#0f172a',
                scene: {
                    xaxis: { title: 'Days Ahead', backgroundcolor: '#0f172a', gridcolor: '#1e293b', color: '#fff' },
                    yaxis: { title: 'Price (USDT)', backgroundcolor: '#0f172a', gridcolor: '#1e293b', color: '#fff' },
                    zaxis: { title: 'Density / Likelihood', backgroundcolor: '#0f172a', gridcolor: '#1e293b', color: '#fff' },
                    camera: { eye: { x: 1.4, y: 1.4, z: 0.9 } }
                }
            };

            Plotly.newPlot('chart-container', [cloudTrace], layout);
        }

        fetchSimulation();
    </script>
</body>
</html>
